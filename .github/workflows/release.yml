name: Release

# Cuts a release for every merge to main, once CI has passed on it: the latest
# vX.Y.Z tag gets its patch number bumped (v0.1.0 if there are no tags yet).
# The version itself comes from that tag via hatch-vcs -- nothing in the repo is
# edited.
#
# For a minor or major release, run this workflow by hand on main ("Run
# workflow", or `gh workflow run release.yml -f bump=minor`). It releases the
# head of main with that part bumped; the next merge continues from it. If the
# merge was already released as a patch, the commit carries both tags.
#
# Runs are serialized, and GitHub keeps only the newest pending one, so merges
# that land close together can share a release. A commit that is already inside
# the latest release is skipped, so an old run finishing late never gets a newer
# version than the code after it. Re-running a run whose release exists only
# re-dispatches publish.yml (which skips files already on PyPI).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [minor, major, patch]
        default: minor

permissions:
  contents: write # create the tag + release
  actions: write # dispatch publish.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUMP: ${{ inputs.bump || 'patch' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # all tags

      - name: Compute version
        id: version
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          existing=$(git tag --points-at HEAD | grep -E "$semver" | sort -V | tail -1 || true)
          if [ -n "$existing" ] && [ "$BUMP" = patch ]; then
            echo "$SHA is already $existing; retrying its release and publish."
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            if [ "$BUMP" = major ]; then next=v1.0.0; else next=v0.1.0; fi
          elif [ -z "$existing" ] && git merge-base --is-ancestor HEAD "$latest"; then
            echo "$SHA is already included in $latest; nothing to do."
            exit 0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v$major.$((minor + 1)).0" ;;
              *) next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Releasing $next ($BUMP bump; previous: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          fi
          # A release made with GITHUB_TOKEN doesn't fire publish.yml's release
          # trigger, so start it directly on the new tag.
          gh workflow run publish.yml --ref "$TAG"
