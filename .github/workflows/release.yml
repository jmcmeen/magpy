name: Release

# Cuts a release for every merge to main, once CI has passed on it: the latest
# vX.Y.Z tag gets its patch number bumped (v0.1.0 if there are no tags yet).
# The version itself comes from that tag via hatch-vcs -- nothing in the repo is
# edited. To bump major/minor instead, push that tag by hand; the next merge
# continues from it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write # create the tag + release
  actions: write # dispatch publish.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # all tags

      - name: Compute next version
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')" ]; then
            echo "$SHA is already released; nothing to do."
            exit 0
          fi
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          # A release made with GITHUB_TOKEN doesn't fire publish.yml's release
          # trigger, so start it directly on the new tag.
          gh workflow run publish.yml --ref "$TAG"
