name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Every other run gets its own group, so each
  # push to main finishes CI and can be released.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Ruff only, no project install, at the exact version in uv.lock so CI
      # and local `uv sync` lint with the same release.
      - name: Resolve locked ruff version
        run: |
          version=$(awk '/^name = "ruff"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)
          test -n "$version" || { echo "ruff not found in uv.lock" >&2; exit 1; }
          echo "RUFF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: uvx "ruff@$RUFF_VERSION" check src tests

      - name: Format check
        run: uvx "ruff@$RUFF_VERSION" format --check src tests

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for hatch-vcs versioning

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3

      - name: Install
        run: uv sync

      - name: Test
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
