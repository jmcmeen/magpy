[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magpy-gui"
version = "0.0.1"
description = "MagPy Bioacoustics"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "John McMeen" }
]
keywords = ["bioacoustics", "audio", "spectrogram", "sound analysis", "annotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]

# MagPy is a GUI wrapper around bioamla. Runtime deps are intentionally minimal:
# bioamla (the analysis engine) plus only what the Qt wrapper itself needs.
# MagPy is a GUI wrapper around bioamla. Runtime deps are intentionally minimal:
# bioamla (the analysis engine) plus the Qt stack and the array lib we touch
# directly. The rest of the audio-domain stack (scipy, librosa, soundfile, pandas,
# matplotlib) and the ML stack (torch, transformers, ...) arrive transitively via
# bioamla 0.2.0 and are NOT declared here -- bioamla pulls them in unconditionally
# (no [ml] extra exists). Playback also goes through bioamla (audio.AudioPlayer),
# so sounddevice is transitive too. numpy is declared because services/widgets
# pass arrays around directly. This list grows as the wrapper adds real imports.
dependencies = [
    "bioamla>=0.2.0",
    "PyQt6>=6.11.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.gui-scripts]
magpy-gui = "magpy.app:main"

[project.urls]
Homepage = "https://github.com/jmcmeen/magpy"
Repository = "https://github.com/jmcmeen/magpy"

[tool.hatch.build.targets.wheel]
packages = ["src/magpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
