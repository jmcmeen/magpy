[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "magpy-gui"
dynamic = ["version"]
description = "MagPy Bioacoustics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "John McMeen", email = "johnmcmeen@gmail.com" }
]
keywords = ["bioacoustics", "audio", "spectrogram", "sound analysis", "annotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]

# MagPy is a GUI wrapper around bioamla. Runtime deps are intentionally minimal:
# bioamla (the analysis engine) plus the Qt stack and the array lib we touch
# directly. The rest of the audio-domain stack (scipy, librosa, soundfile, pandas,
# matplotlib) and the ML stack (torch, transformers, ...) arrive transitively via
# bioamla 0.2.0 and are NOT declared here -- bioamla pulls them in unconditionally
# (no [ml] extra exists). Playback also goes through bioamla (audio.AudioPlayer),
# so sounddevice is transitive too. numpy is declared because services/widgets
# pass arrays around directly. This list grows as the wrapper adds real imports.
dependencies = [
    "bioamla>=0.2.3",
    "PyQt6>=6.11.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.gui-scripts]
magpy-gui = "magpy.app:main"

[project.urls]
Homepage = "https://github.com/jmcmeen/magpy"
Repository = "https://github.com/jmcmeen/magpy"
Changelog = "https://github.com/jmcmeen/magpy/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jmcmeen/magpy/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/magpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["magpy"]
